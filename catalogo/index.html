<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo AMO — materiales</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f6f5f1;--surface:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e4e2da;--accent:#c2410c;--accent-soft:#fff1e8;
  --gram:#2563eb;--voc:#7c3aed;--lec:#0d9488;--cul:#b45309;--jue:#db2777;--tes:#4d7c0f;--lib:#9333ea;--dep:#0891b2;--otr:#64748b;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141413;--surface:#1e1e1c;--ink:#f0eee8;--muted:#9a978e;--line:#33322e;--accent:#fb923c;--accent-soft:#2c1d12;
  --shadow:0 1px 2px rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0 8px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h1 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 0 10px}
.row .lbl{font-size:12px;color:var(--muted);margin-right:2px;text-transform:uppercase;letter-spacing:.05em}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 11px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.65;margin-left:4px;font-size:12px}
.sep{width:1px;height:20px;background:var(--line);margin:0 6px}
main{padding:18px 0 60px}
.stats{color:var(--muted);font-size:13px;margin:0 0 14px}
nav.jump{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
nav.jump a{font-size:13px;padding:4px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
nav.jump a:hover{border-color:var(--accent)}
section.grp{margin-bottom:28px;scroll-margin-top:150px}
.grp>h2{display:flex;align-items:baseline;gap:10px;font-size:17px;margin:0 0 10px;cursor:pointer;user-select:none}
.grp>h2 .cnt{font-size:12px;color:var(--muted);font-weight:400}
.grp>h2 .arrow{font-size:11px;color:var(--muted);transition:transform .15s}
.grp.closed>h2 .arrow{transform:rotate(-90deg)}
.grp.closed .grid{display:none}
.sub{font-size:12px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--otr));border-radius:12px;padding:12px 12px 10px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--c)}
.card .main{position:static}
.card .main::after{content:"";position:absolute;inset:0;border-radius:12px}
.card h3{margin:0;font-size:15px;line-height:1.3}
.card p{margin:0;color:var(--muted);font-size:13px}
.card p.pr{color:var(--ink);background:color-mix(in srgb,var(--c) 9%,transparent);border-radius:8px;padding:6px 8px}
.card p.pr b{color:var(--c)}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.b{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.b.tipo{background:color-mix(in srgb,var(--c) 14%,transparent);border-color:transparent;color:var(--c);font-weight:600}
.b.pub{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.b.warn{background:#fef3c7;color:#92400e;border-color:transparent}
@media (prefers-color-scheme:dark){.b.warn{background:#3b2a07;color:#fcd34d}}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.foot a.gh{position:relative;z-index:2;padding:2px 6px;border-radius:6px}
.foot a.gh:hover{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:60px 0}
footer{color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding:16px 0 40px}
code{background:var(--surface);border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>

/* ===== Lógica ===== */
const $ = s => document.querySelector(s);
const state = {repo:"all",tipo:"all",view:"nivel",q:""};
const fmt = kb => kb>=1024 ? (kb/1024).toFixed(1).replace(".",",")+" MB" : kb+" KB";
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const url = it => (BASE[it.r]||"") + encodeURI(it.p.endsWith("/")?it.p+"index.html":it.p).replace(/\+/g,"%2B");
const ghUrl = it => GH(it.r) + encodeURI(it.p).replace(/\+/g,"%2B");
DATA.forEach(i=>i.hay=norm([i.title,i.d,i.pr,i.l,i.n,TIPOS[i.t].n,i.r,i.x||"",i.p].join(" ")));

function chip(host,label,key,val,count){
  const b=document.createElement("button");b.className="chip";b.type="button";
  b.dataset.k=key;b.dataset.v=val;b.innerHTML=esc(label)+(count!=null?`<span class="n">${count}</span>`:"");
  b.onclick=()=>{state[key]=val;render()};host.appendChild(b);
}
function buildControls(){
  const cnt = f => DATA.filter(f).length;
  const rr=$("#rowRepo");
  chip(rr,"Todo","repo","all",DATA.length);
  chip(rr,"estudiantes (aula)","repo",E,cnt(i=>i.r===E));
  chip(rr,"sitio (público)","repo",S,cnt(i=>i.r===S));
  const rt=$("#rowTipo");
  chip(rt,"Todos","tipo","all");
  Object.entries(TIPOS).forEach(([k,v])=>chip(rt,v.n,"tipo",k,cnt(i=>i.t===k)));
  const rv=$("#rowView");
  chip(rv,"Por nivel","view","nivel");
  chip(rv,"Por tipo","view","tipo");
  chip(rv,"Por almacén","view","repo");
}
function filtered(){
  const toks=norm(state.q).split(/\s+/).filter(Boolean);
  return DATA.filter(i=>(state.repo==="all"||i.r===state.repo)&&(state.tipo==="all"||i.t===state.tipo)&&toks.every(t=>i.hay.includes(t)));
}
function card(i){
  const c=`var(${TIPOS[i.t].c})`;
  const b=[`<span class="b tipo">${TIPOS[i.t].n}</span>`,`<span class="b">${esc(i.l)}</span>`,
    i.r===S?`<span class="b pub">público</span>`:`<span class="b">estudiantes</span>`];
  if(i.dup) b.push(`<span class="b warn" title="${esc(i.dup)}">duplicado</span>`);
  if(i.x) b.push(`<span class="b" title="${esc(i.x)}">${esc(i.x)}</span>`);
  return `<article class="card" style="--c:${c}">
    <a class="main" href="${url(i)}" target="_blank" rel="noopener"><h3>${esc(i.title)}</h3></a>
    <p class="pr"><b>Practica:</b> ${esc(i.pr)}</p>
    <p>${esc(i.d)}</p>
    <div class="badges">${b.join("")}</div>
    <div class="foot"><span>${fmt(i.kb)}</span><a class="gh" href="${ghUrl(i)}" target="_blank" rel="noopener" title="Ver en GitHub">GitHub ↗</a></div>
  </article>`;
}
function groups(items){
  const m=new Map();
  let keys,name,sub=()=>"";
  if(state.view==="nivel"){keys=NIVELES;name=k=>NIVEL_NAME[k];sub=k=>"";}
  else if(state.view==="tipo"){keys=Object.keys(TIPOS);name=k=>TIPOS[k].n;}
  else {keys=[E,S];name=k=>k===E?"estudiantes — material de aula":"sitio — material público";}
  keys.forEach(k=>m.set(k,[]));
  items.forEach(i=>{const k=state.view==="nivel"?i.n:state.view==="tipo"?i.t:i.r;(m.get(k)||m.set(k,[]).get(k)).push(i)});
  return [...m].filter(([,v])=>v.length).map(([k,v])=>({k,name:name(k),items:v}));
}
function render(){
  document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(state[b.dataset.k]===b.dataset.v)));
  const items=filtered(), gs=groups(items);
  const nE=items.filter(i=>i.r===E).length,nS=items.length-nE;
  $("#stats").textContent=`${items.length} materiales — ${nE} en estudiantes, ${nS} en sitio (público)`;
  $("#jump").innerHTML=gs.map(g=>`<a href="#g-${esc(g.k)}">${esc(g.name.replace(/^Nivel /,""))} · ${g.items.length}</a>`).join("");
  $("#out").innerHTML=gs.length?gs.map(g=>{
    const closed=closedSet.has(state.view+g.k)?" closed":"";
    return `<section class="grp${closed}" id="g-${esc(g.k)}" data-key="${esc(state.view+g.k)}">
      <h2><span class="arrow">▼</span>${esc(g.name)} <span class="cnt">${g.items.length}</span></h2>
      <div class="grid">${g.items.map(card).join("")}</div></section>`}).join(""):`<div class="empty">No hay materiales que coincidan.</div>`;
  document.querySelectorAll(".grp>h2").forEach(h=>h.onclick=()=>{
    const s=h.parentElement,k=s.dataset.key;s.classList.toggle("closed");
    s.classList.contains("closed")?closedSet.add(k):closedSet.delete(k);
  });
}
const closedSet=new Set();
buildControls();
$("#q").addEventListener("input",e=>{state.q=e.target.value;render()});
addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus()}});
render();
</script>
