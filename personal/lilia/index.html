<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой чек-лист недели</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: school notebook on grid paper. Week summary on top, one day open at a time, reflection + PDF at the bottom. */
:root{
  --paper:#f4f6fa;
  --sheet:#ffffff;
  --ink:#1c2332;
  --muted:#5b6476;
  --line:#dde3ee;
  --accent:#2f55d4;
  --accent-soft:#e8edfc;
  --mark:#ffe36e;
  --good:#1d8a4b;
  --good-soft:#e3f4ea;
  --font-display:"Unbounded","Manrope",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11141b;--sheet:#191e28;--ink:#e6e9f1;--muted:#9aa3b6;--line:#2a3141;
    --accent:#86a0ff;--accent-soft:#232c45;--mark:#6a5813;--good:#5fd08f;--good-soft:#1c3427;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11141b;--sheet:#191e28;--ink:#e6e9f1;--muted:#9aa3b6;--line:#2a3141;
  --accent:#86a0ff;--accent-soft:#232c45;--mark:#6a5813;--good:#5fd08f;--good-soft:#1c3427;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.45rem}
h2{font-size:1.1rem}
h3{font-size:.95rem;font-family:var(--font-body);font-weight:800}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.money{font-variant-numeric:tabular-nums;font-weight:800;background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 2px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)}
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 12px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .btn.primary{color:#0f1422}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1422}}
.btn.icon{width:40px;padding:8px 0;text-align:center}
.themebtn{white-space:nowrap}
.weeklabel{font-weight:800;min-width:150px;text-align:center}

.summary{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.total{font-family:var(--font-display);font-size:2.2rem;font-variant-numeric:tabular-nums;line-height:1}
.bar{height:12px;border-radius:6px;background:var(--accent-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
@media (prefers-reduced-motion: reduce){.bar>i{transition:none}}
@media (max-width:480px){.summary{grid-template-columns:1fr;gap:10px}}
.breakdown{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted);margin-top:8px}
.breakdown b{color:var(--ink);font-variant-numeric:tabular-nums}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daytab{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem}
.daytab b{font-size:.95rem}
.daytab .sum{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.daytab.today{border-color:var(--accent)}
.daytab.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.daytab.sel .sum{color:#fff}
:root[data-theme="dark"] .daytab.sel,:root[data-theme="dark"] .daytab.sel .sum{color:#0f1422}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .daytab.sel,:root:not([data-theme="light"]) .daytab.sel .sum{color:#0f1422}}

.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px solid var(--line)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .label{display:flex;flex-direction:column}
.row .label span{font-size:.8rem;color:var(--muted)}
.check{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:10px;padding:6px 12px;background:transparent;font-weight:700;min-width:110px;justify-content:center}
.check.on{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);font-weight:800;font-size:1.1rem}
.stepper output{min-width:58px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.full{grid-column:1/-1}
.grades{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:8px}
.grades button{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 0;font-weight:800;font-variant-numeric:tabular-nums}
@media (max-width:480px){.grades{grid-template-columns:repeat(6,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 6px 4px 10px;font-size:.85rem;font-weight:700;background:var(--accent-soft)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip button{border:0;background:transparent;width:22px;height:22px;border-radius:50%;font-weight:800;line-height:1}
.inline{display:flex;gap:8px;margin-top:8px}
input[type=text],input[type=number],input[type=time],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
textarea{min-height:76px;resize:vertical}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{border:2px solid var(--line);background:var(--sheet);border-radius:10px;padding:4px 8px;font-size:1.3rem;display:flex;flex-direction:column;align-items:center;min-width:56px}
.moods button span{font-size:.7rem;font-weight:700;color:var(--muted)}
.moods button.on{border-color:var(--accent);background:var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800;font-size:.9rem}
.diary{display:flex;flex-direction:column;gap:14px;margin-top:14px;padding-top:14px;border-top:2px solid var(--line)}
.note{font-size:.8rem;color:var(--muted)}

details.settings summary{cursor:pointer;font-weight:800}
.setgrid{display:grid;grid-template-columns:1fr 120px;gap:8px 12px;align-items:center;margin-top:12px}
.setgrid label{font-size:.9rem}
.rules{margin:8px 0 0;padding-left:18px;font-size:.9rem}
.rules li{margin:2px 0}
.pdfrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#pdfMsg{font-size:.85rem;color:var(--muted)}

.lessons{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.lesson{display:grid;grid-template-columns:26px 92px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-left:4px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 10px}
.lesson .ln{font-weight:800;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.lesson .lt{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lesson .ls{display:flex;flex-direction:column;line-height:1.25}
.lesson small,.ttday small{color:var(--muted);font-size:.78rem}
.lesson .lc{font-size:.85rem;font-weight:800;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.lesson.on{border-color:var(--good);border-left-color:var(--good);background:var(--good-soft)}
.lesson.on .lc{color:var(--good)}
.lesson.now{border-left-color:var(--accent)}
.lesson.past:not(.on){opacity:.75}
.nowpill{font-style:normal;background:var(--accent);color:var(--sheet);border-radius:999px;padding:1px 8px;font-size:.72rem}
@media (max-width:480px){.lesson{grid-template-columns:22px 1fr auto}.lesson .lt{grid-column:2;grid-row:2;font-size:.78rem}.lesson .ls{grid-column:2;grid-row:1}.lesson .lc{grid-column:3;grid-row:1/3}}
select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
details.tt summary{cursor:pointer}
.ttgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
.ttday{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ttday.cur{border-color:var(--accent)}
.ttday ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ttday li{display:grid;grid-template-columns:16px 40px 1fr;gap:6px;font-size:.88rem;line-height:1.25}
.ttday li span:last-child{display:flex;flex-direction:column}
.ttday .ln{font-weight:800;color:var(--muted)}
.ttday .lt{color:var(--muted);font-variant-numeric:tabular-nums}
.dot.warn{background:#d9482b}
/* ---------- weekly report (screen + PDF) ---------- */
.rv{display:flex;flex-direction:column;gap:14px}
.rv .blk{display:flex;flex-direction:column;gap:12px}
.rv-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.rv-k{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:800}
.rv-h{font-family:var(--font-display);font-size:1.15rem;font-weight:700;line-height:1.25}
.rv-tot{text-align:right}
.rv-tot b{display:block;font-family:var(--font-display);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.rv-tot span{font-size:.8rem;color:var(--muted)}
.rv-sum{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--muted)}
.rv-sum b{color:var(--ink)}
.rv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.rv-grid{grid-template-columns:1fr}}
.rv-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--sheet)}
.rv-card h4{margin:0 0 10px;font-size:.85rem;font-weight:800;font-family:var(--font-body)}
.rv-mood,.rv-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.rv-mcol,.rv-bcol{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.rv-mcol em,.rv-bcol em{font-style:normal;font-size:.72rem;color:var(--muted);font-weight:700}
.rv-mtrack{position:relative;width:100%;height:110px;border-radius:8px;background:repeating-linear-gradient(to top,var(--accent-soft) 0 1px,transparent 1px 27px)}
.rv-mdot{position:absolute;left:50%;transform:translateX(-50%);font-size:1.4rem;line-height:1}
.rv-btrack{width:100%;height:110px;display:flex;align-items:flex-end;justify-content:center}
.rv-btrack i{display:block;width:70%;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}
.rv-bv{font-size:.7rem;font-weight:800;font-variant-numeric:tabular-nums}
.rv-hab{display:grid;grid-template-columns:128px repeat(7,1fr);gap:4px;align-items:center;font-size:.8rem}
.rv-hab .hh{color:var(--muted);text-align:center;font-weight:800;font-size:.72rem;line-height:1.2}
.rv-hab .hl{font-weight:700}
.rv-hab .c{height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--accent-soft);color:var(--muted)}
.rv-hab .c.on{background:var(--good-soft);color:var(--good)}
.rv-hab .c.na{background:transparent}
@media (max-width:480px){.rv-hab{grid-template-columns:84px repeat(7,1fr);font-size:.72rem}}
.rv-lrow{display:grid;grid-template-columns:28px 1fr 46px;gap:8px;align-items:center;font-size:.82rem;margin:5px 0}
.rv-lrow .bar{height:10px}
.rv-lrow span{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.rv-note{border-left:4px solid var(--accent);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px}
.rv-note .dh{font-weight:800}
.rv-note .q{font-weight:800;font-size:.85rem;margin-top:6px}
.rv-note .a{white-space:pre-wrap;font-size:.92rem}
.rv-empty{color:var(--muted);font-size:.85rem}
.bk{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.bk label.btn{display:inline-block}
.bk input[type=file]{display:none}
/* Offscreen report used for PDF: always light, fixed width */
#report{position:fixed;left:-10000px;top:0;width:760px;background:#fff;color:#1c2332;font-family:var(--font-body);
  --paper:#f4f6fa;--sheet:#ffffff;--ink:#1c2332;--muted:#5b6476;--line:#dde3ee;--accent:#2f55d4;--accent-soft:#e8edfc;--mark:#ffe36e;--good:#1d8a4b;--good-soft:#e3f4ea}
#report .blk{padding:18px 24px;background:#fff}
#report .rv-grid{grid-template-columns:1fr 1fr}
#report .rv-hab{grid-template-columns:128px repeat(7,1fr);font-size:.8rem}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="report" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";

/* ---------- constants & helpers ---------- */
const DAY_SHORT=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const DAY_LONG=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MOODS=[["😞","плохо"],["😕","так себе"],["😐","нормально"],["🙂","хорошо"],["😄","супер"]];
const TIMES={0:["8:05","8:50"],1:["9:00","9:45"],2:["9:55","10:40"],3:["10:50","11:35"],4:["11:45","12:30"],5:["12:40","13:25"],6:["13:35","14:10"],7:["14:20","14:55"],8:["15:05","15:40"]};
const SCHED=[
 [[1,"Англійська мова","Дуріхіна"],[2,"Англійська мова","Дуріхіна"],[3,"Біологія","Дзюбенко"],[4,"Фізика","Борзенко"],[5,"Світова література","Осетинський"],[6,"Англійська мова","Дуріхіна"],[7,"Хімія","Дзюбенко"],[8,"Дод. математика","Таранська"]],
 [[0,"Фізкультура","Грубник"],[1,"Англійська мова","Дуріхіна"],[2,"Географія","Райков"],[3,"Захист Вітчизни","Майборода"],[4,"Історія України","Ступак"],[5,"Українська мова","Максимова"],[6,"Українська література","Максимова"],[7,"Зарубіжна література","Донська"],[8,"Безпековий практикум","Дуріхіна"]],
 [[1,"Всесвітня історія","Ступак"],[2,"Громадянська освіта","Майборода"],[3,"Громадянська освіта","Майборода"],[4,"Інформатика / Мистецтво","Бутенко / Івенська"],[5,"Інформатика","Бутенко"],[6,"Фізика","Борзенко"],[7,"Дод. математика","Таранська"]],
 [[0,"Фізкультура","Грубник"],[1,"Алгебра","Таранська"],[2,"Географія","Райков"],[3,"Геометрія","Таранська"],[4,"Зарубіжна література","Донська"],[5,"Англійська мова","Дуріхіна"],[6,"Англійська мова","Дуріхіна"],[7,"Мистецтво","Івенська"],[8,"Дод. українська мова","Максимова"]],
 [[1,"Фізика","Борзенко"],[2,"Світова література","Осетинський"],[3,"Українська мова","Максимова"],[4,"Українська література","Максимова"],[5,"Історія України","Ступак"],[6,"Алгебра","Таранська"],[7,"Алгебра","Таранська"]],
 [],[]
];
const toMin=t=>{const [h,m]=t.split(":").map(Number);return h*60+m;};
const DEFAULTS={name:"",wakeTime:"9:00",lessonsDefault:6,pLesson:8,pHomework:20,pWake:10,gradeGood:10,pGradeGood:15,gradeOk:7,pGradeOk:5,pHelp:30,target:600};

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function parseYmd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function weekLabel(key){const a=parseYmd(key),b=addDays(a,6);
  return a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${MONTHS[b.getMonth()]}`:`${a.getDate()} ${MONTHS[a.getMonth()]} – ${b.getDate()} ${MONTHS[b.getMonth()]}`;}
const clone=o=>JSON.parse(JSON.stringify(o));
const num=(v,d)=>{const n=Number(v);return isFinite(n)?n:d;};

let storageOK=true, persisted=false;
const LS={get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){storageOK=false;return false;}}};

/* ---------- theme (auto / light / dark) ---------- */
const THEMES=["auto","light","dark"];
const THEME_UI={auto:["🌓","Авто"],light:["☀️","День"],dark:["🌙","Ночь"]};
let theme=LS.get("cl:theme");if(THEMES.indexOf(theme)<0)theme="auto";
function applyTheme(){const r=document.documentElement;if(theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",theme);}
applyTheme();

/* ---------- state ---------- */
const S=Object.assign({},DEFAULTS);
const todayKey=ymd(mondayOf(new Date()));
let weekKey=todayKey;
let selDay=(new Date().getDay()+6)%7;
let W=loadLocalWeek(weekKey);

function emptyDay(i){return {off:false,att:[],woke:false,planned:0,attended:0,hw:false,grades:[],tidy:false,help:[],mood:0,interesting:"",thoughts:""};}
function emptyWeek(){const days=[0,1,2,3,4,5,6].map(emptyDay);days.forEach((d,i)=>derive(d,i));return {days,proud:"",hard:"",updatedAt:0};}
function normWeek(w){const e=emptyWeek();if(!w||!Array.isArray(w.days))return e;
  e.days=e.days.map((d,i)=>Object.assign(d,w.days[i]||{}));
  ["proud","hard"].forEach(k=>e[k]=w[k]||"");e.updatedAt=num(w.updatedAt,0);
  e.days.forEach((d,i)=>{if(!Array.isArray(d.grades))d.grades=[];if(!Array.isArray(d.help))d.help=[];if(!Array.isArray(d.att))d.att=[];derive(d,i);});
  return e;}
function derive(d,i){d.planned=d.off?0:SCHED[i].filter(l=>l[0]>0).length;if(d.off)d.att=[];d.attended=d.att.length;}
function loadLocalWeek(k){return normWeek(LS.get("cl:week:"+k));}

/* ---------- money ---------- */
function gradeBonus(g){g=num(g.v,0);if(g>=S.gradeGood)return num(S.pGradeGood,0);if(g>=S.gradeOk)return num(S.pGradeOk,0);return 0;}
function dayParts(d){
  const school=d.planned>0;
  return {
    lessons:d.attended*num(S.pLesson,0),
    hw:school&&d.hw?num(S.pHomework,0):0,
    wake:school&&d.woke?num(S.pWake,0):0,
    grades:d.grades.reduce((s,g)=>s+gradeBonus(g),0),
    help:d.help.length*num(S.pHelp,0)
  };}
const sumParts=p=>p.lessons+p.hw+p.wake+p.grades+p.help;
function weekParts(){const t={lessons:0,hw:0,wake:0,grades:0,help:0};W.days.forEach(d=>{const p=dayParts(d);for(const k in t)t[k]+=p[k];});return t;}
function exampleWeek(){const L=SCHED.reduce((a,x)=>a+x.filter(l=>l[0]>0).length,0);return L*S.pLesson+5*S.pHomework+5*S.pWake+4*S.pGradeGood+3*S.pHelp;}

function setStatus(){const el=document.getElementById("status");if(el)el.innerHTML=statusHTML();}

async function initStorage(){
  try{localStorage.setItem("cl:t","1");localStorage.removeItem("cl:t");storageOK=true;}catch(e){storageOK=false;}
  try{
    if(navigator.storage&&navigator.storage.persisted){
      persisted=await navigator.storage.persisted();

    }
  }catch(e){}

}
/* копия записей в файл и загрузка обратно */
let bkMsg="";
function saveBlob(blob,name){
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=name;a.style.display="none";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},4000);
}
function exportData(){
  const weeks={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
    if(k&&k.indexOf("cl:week:")===0){const v=LS.get(k);if(v)weeks[k.slice(8)]=v;}}}catch(e){}
  const n=Object.keys(weeks).length;
  if(!n){bkMsg="Пока нечего сохранять: записей ещё нет.";render();return;}
  const blob=new Blob([JSON.stringify({app:"checklist-nedeli",version:1,exported:new Date().toISOString(),weeks},null,1)],{type:"application/json"});
  saveBlob(blob,"zapisi-"+ymd(new Date())+".json");
  bkMsg="Копия сохранена в загрузки (недель: "+n+"). Положи файл в надёжное место.";render();
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);let n=0,total=0;
      if(!data||data.app!=="checklist-nedeli"||typeof data.weeks!=="object")throw new Error("format");
      for(const k in data.weeks){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(k))continue;total++;
        const inc=normWeek(data.weeks[k]),cur=LS.get("cl:week:"+k);
        if(!cur||num(cur.updatedAt,0)<=inc.updatedAt){if(LS.set("cl:week:"+k,inc))n++;}
      }
      W=loadLocalWeek(weekKey);
      bkMsg="Загружено недель: "+n+" из "+total+".";
    }catch(e){bkMsg="Не получилось прочитать файл. Нужен файл, сохранённый кнопкой «Сохранить копию».";}
    render();
  };
  r.onerror=()=>{bkMsg="Не получилось открыть файл.";render();};
  r.readAsText(file);
}

  const mon=parseYmd(weekKey),p=weekParts(),t=sumParts(p),pct=Math.min(100,Math.round(t/Math.max(1,S.target)*100));
  let att=0,pl=0;W.days.forEach(d=>{att+=d.attended;pl+=d.planned;});
  const ds=W.days.map((d,i)=>({d,i,s:DAY_SHORT[i],dt:addDays(mon,i),earn:sumParts(dayParts(d))}));
  const maxE=Math.max(50,...ds.map(x=>x.earn));
  const withMood=ds.filter(x=>x.d.mood);
  const avgM=withMood.length?Math.round(withMood.reduce((a,x)=>a+x.d.mood,0)/withMood.length):0;
  const best=ds.reduce((a,x)=>x.earn>a.earn?x:a,ds[0]);
  const mood=`<div class="rv-mood">${ds.map(x=>`<div class="rv-mcol"><div class="rv-mtrack">${x.d.mood?`<span class="rv-mdot" style="bottom:${((x.d.mood-1)/4*78).toFixed(1)}%">${MOODS[x.d.mood-1][0]}</span>`:""}</div><em>${x.s}</em></div>`).join("")}</div>`;
  const bars=`<div class="rv-bars">${ds.map(x=>`<div class="rv-bcol"><span class="rv-bv">${x.earn}</span><div class="rv-btrack"><i style="height:${(x.earn/maxE*100).toFixed(1)}%"></i></div><em>${x.s}</em></div>`).join("")}</div>`;
  const row=(label,fn,showN)=>`<div class="hl">${label}</div>`+ds.map(x=>{const r=fn(x.d);
    return `<div class="c ${r>0?"on":r===0?"":"na"}">${r>0?(showN?r:"✓"):r===0?"—":"·"}</div>`;}).join("");
  const hab=`<div class="rv-hab"><div></div>${ds.map(x=>`<div class="hh">${x.s}<br>${x.dt.getDate()}</div>`).join("")}
    ${row("Встала вовремя",d=>d.planned>0?(d.woke?1:0):-1)}${row("Домашка",d=>d.planned>0?(d.hw?1:0):-1)}
    ${row("Убрала за собой",d=>d.tidy?1:0)}${row("Помогла сама",d=>d.help.length,true)}</div>`;
  const lrows=ds.filter(x=>x.d.planned>0).map(x=>`<div class="rv-lrow"><em style="font-style:normal;font-weight:800;color:var(--muted)">${x.s}</em><div class="bar"><i style="width:${(x.d.attended/x.d.planned*100).toFixed(0)}%"></i></div><span>${x.d.attended}/${x.d.planned}</span></div>`).join("");
  const grades=[];ds.forEach(x=>x.d.grades.forEach(g=>grades.push({v:num(g.v,0),s:g.s,day:x.s})));
  const avgG=grades.length?(grades.reduce((a,g)=>a+g.v,0)/grades.length):0;
  const gradeChips=grades.map(g=>`<span class="chip ${g.v>=S.gradeGood?"good":""}" style="padding:4px 10px">${esc(g.day)}${g.s?" · "+esc(g.s):""}: ${g.v}</span>`).join("");
  const helps=[];ds.forEach(x=>x.d.help.forEach(h=>helps.push({h,day:x.s})));
  const blocks=[];
  blocks.push(`<div class="blk">
    <div class="rv-top"><div><div class="rv-k">Чек-лист недели</div><div class="rv-h">${weekLabel(weekKey)} ${mon.getFullYear()}${S.name?" · "+esc(S.name):""}</div></div>
      <div class="rv-tot"><b>${t} ₴</b><span>${pct}% от цели ${S.target} ₴</span></div></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="rv-sum"><span>Уроки <b>${att}/${pl}</b></span>${best.earn>0?`<span>Лучший день <b>${best.s}, ${best.earn} ₴</b></span>`:""}<span>Среднее настроение <b>${avgM?MOODS[avgM-1][0]+" "+MOODS[avgM-1][1]:"—"}</b></span>${grades.length?`<span>Средняя оценка <b>${avgG.toFixed(1).replace(".",",")}</b></span>`:""}</div>
    <div class="rv-grid">
      <section class="rv-card"><h4>Настроение по дням</h4>${mood}</section>
      <section class="rv-card"><h4>Заработано по дням, ₴</h4>${bars}</section>
    </div>
    <section class="rv-card"><h4>Привычки недели</h4>${hab}</section>
    <div class="rv-grid">
      <section class="rv-card"><h4>Уроки, на которых была</h4>${lrows||'<div class="rv-empty">В эту неделю уроков нет.</div>'}</section>
      <section class="rv-card"><h4>Оценки</h4>${gradeChips?`<div class="chips" style="margin-top:0">${gradeChips}</div>`:'<div class="rv-empty">Оценок пока нет.</div>'}</section>
    </div>
    <section class="rv-card"><h4>Помогла сама, без просьбы</h4>${helps.length?`<div class="chips" style="margin-top:0">${helps.map(x=>`<span class="chip good" style="padding:4px 10px">${x.day}: ${esc(x.h)}</span>`).join("")}</div>`:'<div class="rv-empty">Пока ничего не записано.</div>'}</section>
  </div>`);
  ds.forEach(x=>{
    const d=x.d;if(!d.interesting&&!d.thoughts)return;
    blocks.push(`<div class="blk"><div class="rv-note"><div class="dh">${DAY_LONG[x.i]}, ${x.dt.getDate()} ${MONTHS[x.dt.getMonth()]} ${d.mood?MOODS[d.mood-1][0]+" "+MOODS[d.mood-1][1]:""}</div>
      ${d.interesting?`<div class="q">Что было интересного</div><div class="a">${esc(d.interesting)}</div>`:""}
      ${d.thoughts?`<div class="q">Мысли и ощущения</div><div class="a">${esc(d.thoughts)}</div>`:""}</div></div>`);
  });
  if(W.proud||W.hard){
    blocks.push(`<div class="blk"><div class="rv-note"><div class="dh">Итоги недели</div>
      ${W.proud?`<div class="q">Чем я горжусь</div><div class="a">${esc(W.proud)}</div>`:""}
      ${W.hard?`<div class="q">Что было трудно</div><div class="a">${esc(W.hard)}</div>`:""}</div></div>`);
  }
  return blocks;
}
async function makePdf(btn){
  const msg=document.getElementById("pdfMsg");
  const say=t=>{if(msg)msg.textContent=t;};
  if(!window.html2canvas||!window.jspdf){say("Не загрузились инструменты для PDF. Проверь интернет и обнови страницу.");return;}
  btn.disabled=true;say("Собираю PDF…");
  try{
    try{await document.fonts.ready;}catch(e){}
    const rep=document.getElementById("report");
    const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4"});
    const PW=pdf.internal.pageSize.getWidth(),PH=pdf.internal.pageSize.getHeight(),M=28,IW=PW-2*M;
    let y=M;
    for(const html of reportBlocks()){
      rep.innerHTML=html;
      const cv=await window.html2canvas(rep.firstElementChild,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false});
      const ratio=IW/cv.width;let srcY=0;
      while(srcY<cv.height){
        const room=PH-M-y;
        let sliceH=Math.min(cv.height-srcY,Math.floor(room/ratio));
        if(sliceH<60&&y>M){pdf.addPage();y=M;continue;}
        if(srcY===0&&cv.height*ratio>room&&cv.height*ratio<=PH-2*M&&y>M){pdf.addPage();y=M;continue;}
        const part=document.createElement("canvas");part.width=cv.width;part.height=sliceH;
        part.getContext("2d").drawImage(cv,0,srcY,cv.width,sliceH,0,0,cv.width,sliceH);
        pdf.addImage(part.toDataURL("image/jpeg",0.92),"JPEG",M,y,IW,sliceH*ratio);
        y+=sliceH*ratio+8;srcY+=sliceH;
        if(srcY<cv.height){pdf.addPage();y=M;}
      }
    }
    rep.innerHTML="";
    saveBlob(pdf.output("blob"),"nedelya-"+weekKey+".pdf");
    say("Готово: PDF сохранён в загрузки.");
  }catch(e){
    say("Не получилось сохранить PDF. Попробуй ещё раз.");
  }finally{btn.disabled=false;}
}

/* ---------- start ---------- */
render();
initStorage();
})();
</script>
