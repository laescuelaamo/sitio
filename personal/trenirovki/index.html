<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Тренировки дома</title>
<style>
:root{--bg:#f5f1ea;--card:#fff;--ink:#1d2b2f;--muted:#5f6d70;--line:#e6ded2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px}
h1{font-size:clamp(28px,5vw,42px);margin:0 0 8px;text-align:center;letter-spacing:-.5px}
p.sub{margin:0 0 30px;color:var(--muted);text-align:center;font-size:18px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;max-width:760px}
@media (max-width:560px){.pick{grid-template-columns:1fr}}
a.card{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;border-radius:22px;padding:28px 24px;min-height:230px;box-shadow:0 1px 0 var(--line),0 10px 30px rgba(30,40,40,.08);transition:transform .15s,box-shadow .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-4px);box-shadow:0 14px 36px rgba(30,40,40,.14);outline:none}
a.card:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.a{background:linear-gradient(135deg,#1f5c5a,#163f3e);color:#fff}
.d{background:linear-gradient(135deg,#c2546d,#8f3350);color:#fff}
.em{font-size:44px;line-height:1}
.nm{font-size:30px;font-weight:850}
.tx{opacity:.92;font-size:16px}
.go{margin-top:auto;font-weight:800}
</style>
</head>
<body>
<h1>Тренировки дома</h1>
<p class="sub">Кто сегодня занимается?</p>
<div class="pick">
  <a class="card a" href="anton/">
    <span class="em">🏋️</span><span class="nm">Антон</span>
    <span class="tx">Гиря, баланс борд, скакалка. Тренировки по дням, питание и калькулятор.</span>
    <span class="go">Открыть →</span>
  </a>
  <a class="card d" href="dasha/">
    <span class="em">🌸</span><span class="nm">Даша</span>
    <span class="tx">Мягкая программа, которая подстраивается под самочувствие. Резинки, гиря, баланс борд, питание.</span>
    <span class="go">Открыть →</span>
  </a>
</div>
</body>
</html>
